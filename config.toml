# JobPilot settings (safe to commit). Secrets go in .env, never here.

[search]
# A job matches if its title contains any of these (case-insensitive).
role_keywords = [
    ".net", "c#", "asp.net",
    "ai engineer", "llm", "machine learning", "ai automation", "automation engineer",
    "backend", "full stack", "full-stack",
    "solutions architect", "software architect",
    "project manager", "team lead", "tech lead", "engineering manager",
]
# A job matches if its location contains any of these (case-insensitive).
locations = ["remote", "worldwide", "anywhere", "bangladesh", "dhaka"]
# ...unless it also contains one of these (remote roles restricted to regions you can't work from).
exclude_locations = [
    "us only", "usa only", "u.s. only", "united states only", "us-only",
    "north america only", "latin america only", "canada only",
    "uk only", "europe only", "eu only",
]

[sources]
enabled = ["remotive", "remoteok", "arbeitnow", "weworkremotely", "greenhouse", "lever"]

[boards]
# Company careers boards. The name is in the careers URL:
#   job-boards.greenhouse.io/<name>   or   jobs.lever.co/<name>
greenhouse = ["gitlab", "canonical", "grafanalabs"]
lever = ["toptal"]

[database]
path = "data/jobpilot.db"

[llm]
# Gemini model id. The free tier has small per-model quotas; see Google AI Studio for yours.
model = "gemini-flash-latest"
